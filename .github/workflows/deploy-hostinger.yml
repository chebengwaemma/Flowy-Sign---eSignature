# Build Next.js with webpack + standalone, then upload to Hostinger over FTP.
# Avoids Hostinger server-side Turbopack / missing-devDependency CSS failures by
# building on GitHub Actions (full install) before FTP.
#
# Required repo secrets:
#   FTP_SERVER       e.g. ftp.yourdomain.com or Hostinger FTP hostname
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_SERVER_DIR   e.g. /public_html/  or /domains/yourdomain.com/public_html/
#
# Optional build/runtime secrets (injected at build for NEXT_PUBLIC_*):
#   NEXT_PUBLIC_APP_URL
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   AUTH_SECRET, ADMIN_AUTH_SECRET, MONGODB_URI, Stripe keys, etc. (set on Hostinger too)
# Email (set as Hostinger Node runtime env AND/OR Admin CMS Resend fields):
#   RESEND_API_KEY, EMAIL_FROM

name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Full install (not --omit=dev) so @tailwindcss/postcss / typescript resolve.
      - name: Install dependencies
        run: npm ci

      - name: Clear stale Next cache
        run: rm -rf .next

      - name: Build standalone (webpack + Hostinger prepare)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_AUTH_SECRET: ${{ secrets.ADMIN_AUTH_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          # package.json "build" is already: next build --webpack
          npm run hostinger:build
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          echo "Standalone package OK"

      - name: Verify FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing. Add it under Repo → Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Deploy standalone via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.next/standalone/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          log-level: standard
